name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare arm64 binaries
        run: |
          mkdir -p bin
          cp bin/darwin/arm64/yt-dlp bin/yt-dlp
          cp bin/darwin/arm64/ffmpeg bin/ffmpeg
          chmod +x bin/yt-dlp bin/ffmpeg
          rm -rf bin/win32 bin/darwin bin/linux
      - name: Build
        run: pnpm build:mac:arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-arm64-builds
          path: |
            release/**/*-arm64-Mac-*.dmg
            release/**/*-arm64-Mac-*.zip
          retention-days: 7

  build-mac-x64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare x64 binaries
        run: |
          mkdir -p bin
          cp bin/darwin/x64/yt-dlp bin/yt-dlp
          cp bin/darwin/x64/ffmpeg bin/ffmpeg
          chmod +x bin/yt-dlp bin/ffmpeg
          rm -rf bin/win32 bin/darwin bin/linux
      - name: Build
        run: pnpm build:mac:x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-x64-builds
          path: |
            release/**/*-x64-Mac-*.dmg
            release/**/*-x64-Mac-*.zip
          retention-days: 7

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare binaries
        shell: bash
        run: |
          mkdir -p bin
          cp bin/win32/x64/yt-dlp.exe bin/yt-dlp.exe
          cp bin/win32/x64/ffmpeg.exe bin/ffmpeg.exe
          rm -rf bin/win32 bin/darwin bin/linux
      - name: Build
        run: pnpm build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_BUILDER_HTTP_TIMEOUT: 600000
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-builds
          path: |
            release/**/*.exe
          retention-days: 7

  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare x64 binaries
        run: |
          mkdir -p bin
          cp bin/linux/x64/yt-dlp bin/yt-dlp
          cp bin/linux/x64/ffmpeg bin/ffmpeg
          chmod +x bin/yt-dlp bin/ffmpeg
          rm -rf bin/win32 bin/darwin bin/linux
      - name: Build
        run: pnpm build:linux:x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-builds
          path: |
            release/**/*-x64-Linux-*.AppImage
            release/**/*-x64-Linux-*.deb
            release/**/*-x64-Linux-*.rpm
            release/**/*-x64-Linux-*.tar.gz
          retention-days: 7

  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare arm64 binaries
        run: |
          mkdir -p bin
          cp bin/linux/arm64/yt-dlp bin/yt-dlp
          cp bin/linux/arm64/ffmpeg bin/ffmpeg
          chmod +x bin/yt-dlp bin/ffmpeg
          rm -rf bin/win32 bin/darwin bin/linux
      - name: Build
        run: pnpm build:linux:arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-builds
          path: |
            release/**/*-arm64-Linux-*.AppImage
            release/**/*-arm64-Linux-*.deb
            release/**/*-arm64-Linux-*.rpm
            release/**/*-arm64-Linux-*.tar.gz
          retention-days: 7

  release:
    needs: [build-mac-arm64, build-mac-x64, build-win, build-linux-x64, build-linux-arm64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          
          NOTES=$(awk "/^## \\[${VERSION}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md)
          
          if [ -z "$NOTES" ]; then
            NOTES=$(awk '/^## \[Unreleased\]/{found=1; next} /^## \[/{if(found) exit} found{print}' CHANGELOG.md)
          fi
          
          if [ -z "$NOTES" ]; then
            NOTES="DownVid ${TAG} 发布"
          fi
          
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          body: ${{ steps.changelog.outputs.notes }}
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.tar.gz

name: Update binaries

# 手动触发：下载最新 yt-dlp（nightly）与 ffmpeg，校验后通过 Git LFS 提交到当前分支。
# 站点失效时通常只需更新 yt-dlp：运行本工作流后再打 tag 发版即可。
on:
  workflow_dispatch:
    inputs:
      platform:
        description: '平台：all / win32 / darwin / linux'
        required: true
        default: all

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # 二进制会被全部覆盖，无需先拉取旧的 LFS 对象
      - uses: actions/checkout@v7
        with:
          lfs: false
      - name: Download binaries
        run: |
          git lfs install --local
          bash bin/download-deps.sh "${{ inputs.platform }}" --force
      - name: Show versions
        run: |
          echo "yt-dlp: $(bin/linux/x64/yt-dlp --version 2>/dev/null || echo '-')"
          bin/linux/x64/ffmpeg -version 2>/dev/null | head -1 || true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin
          if git diff --cached --quiet; then
            echo "二进制无变化"
            exit 0
          fi
          VERSION=$(bin/linux/x64/yt-dlp --version 2>/dev/null || echo unknown)
          git commit -m "chore(bin): 更新 yt-dlp 与 ffmpeg 二进制" -m "yt-dlp ${VERSION}（${{ inputs.platform }}）"
          git push origin "HEAD:${GITHUB_REF_NAME}"

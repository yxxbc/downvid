name: 平台解析问题
description: 某个平台的视频无法解析或下载
title: "[解析] "
labels: ["parse-error"]
body:
  - type: markdown
    attributes:
      value: |
        特定平台的解析/下载问题请使用此模板。

  - type: dropdown
    id: platform
    attributes:
      label: 视频来源平台
      options:
        - 抖音
        - 快手
        - B站 (哔哩哔哩)
        - YouTube
        - 小红书
        - Instagram
        - TikTok
        - Twitter/X
        - 其他
    validations:
      required: true

  - type: input
    id: video_url
    attributes:
      label: 视频链接
      placeholder: 粘贴完整的视频链接
    validations:
      required: true

  - type: dropdown
    id: problem_type
    attributes:
      label: 问题类型
      options:
        - 无法解析（提示解析失败）
        - 能解析但没有画质选项
        - 画质不全（缺少高清选项）
        - 下载失败
        - 下载后视频无法播放
        - 需要 Cookie 但不知道怎么获取
    validations:
      required: true

  - type: textarea
    id: error_message
    attributes:
      label: 错误提示
      placeholder: 粘贴应用中显示的错误信息
    validations:
      required: false

  - type: input
    id: app_version
    attributes:
      label: DownVid 版本
      placeholder: 例: 1.0.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，没有重复
          required: true
        - label: 该链接在浏览器中可以正常打开
          required: false

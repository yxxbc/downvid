name: Bug 报告
description: 报告一个 Bug
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的反馈！请填写以下信息帮助我们定位问题。

  - type: dropdown
    id: platform
    attributes:
      label: 运行平台
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows 10/11
        - Linux
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: DownVid 版本
      placeholder: 例: 1.0.0
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      placeholder: 简洁描述遇到的问题
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开应用
        2. 粘贴链接
        3. 点击解析
        4. 出现错误
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 错误日志
      description: 如果有报错，请粘贴日志内容
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 Issue，没有重复
          required: true
        - label: 我使用的是最新版本
          required: false

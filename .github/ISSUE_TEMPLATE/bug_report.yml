name: Bug 报告
description: 报告一个 Bug
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请填写以下信息帮助我们定位问题。

  - type: dropdown
    id: platform
    attributes:
      label: 运行平台
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows 10
        - Windows 11
        - Linux (Ubuntu/Debian)
        - Linux (Arch)
        - Linux (其他)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: DownVid 版本号
      placeholder: 例: 1.0.0（在「关于」页面查看）
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: 问题类型
      options:
        - 视频解析失败
        - 下载失败/中断
        - 下载后无法播放
        - 界面显示异常
        - 应用闪退/卡死
        - Cookie 相关问题
        - 自动更新问题
        - 其他
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      placeholder: 简洁描述你遇到的问题
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开应用
        2. 粘贴链接: https://...
        3. 点击「解析」
        4. 选择画质
        5. 点击下载
        6. 出现错误提示: ...
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: 视频链接（如适用）
      placeholder: 粘贴你尝试下载的视频链接
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      placeholder: 你期望会发生什么？
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: 截图/录屏
      placeholder: 如果方便，请附上截图或录屏
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 错误日志
      description: |
        日志文件位置:
        - macOS: `~/Library/Application Support/downvid/downvid.log`
        - Windows: `%APPDATA%\downvid\downvid.log`
        - Linux: `~/.config/downvid/downvid.log`
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，没有重复
          required: true
        - label: 我使用的是最新版本
          required: false
        - label: 我已阅读 README 和常见问题
          required: false

name: 功能请求
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        有好的想法？告诉我们！

  - type: dropdown
    id: category
    attributes:
      label: 功能类别
      options:
        - 视频下载相关
        - 界面/交互改进
        - 新平台支持
        - 设置/配置
        - 性能优化
        - 其他
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 功能描述
      placeholder: 简洁描述你想要的功能
    validations:
      required: true

  - type: textarea
    id: usecase
    attributes:
      label: 使用场景
      placeholder: |
        什么情况下你需要这个功能？
        例: 我经常需要下载 B站合集，但目前只能一个一个下载...
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      placeholder: 你是否尝试过其他方式达到同样效果？
    validations:
      required: false

  - type: textarea
    id: mockup
    attributes:
      label: 界面草图（可选）
      placeholder: 如果涉及界面改动，可以画个草图或描述期望的布局
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，没有重复
          required: true
